<style>

.masthead{position:absolute;z-index:30;top:clamp(16px,3vw,32px);left:clamp(18px,3vw,45px);right:clamp(18px,3vw,45px);display:flex;justify-content:space-between;align-items:flex-start;gap:20px;pointer-events:none}
.brand{font-size:12px;letter-spacing:.22em;font-weight:700}

.warp-overlay{position:absolute;z-index:20;inset:0;pointer-events:none;opacity:0;overflow:hidden}

.universe.warping .warp-overlay{opacity:1}
.universe.warping .rings{animation:vortex 2s ease-in-out both}
@keyframes vortex{0%{transform:translate(-50%,-50%) scale(.02) rotate(0);opacity:.2}50%{transform:translate(-50%,-50%) scale(.65) rotate(620deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.07) rotate(1080deg);opacity:0}}
.warp-caption{position:absolute;z-index:29;left:0;right:0;top:22%;text-align:center;letter-spacing:.24em;font-size:clamp(11px,1.2vw,18px);opacity:0;transition:opacity .15s;pointer-events:none;text-shadow:0 0 24px #fff}
.universe.warping .warp-caption{opacity:1}
@media(max-width:750px){
 .ship{width:clamp(360px,95vw,560px)}
 .masthead{top:15px;left:15px;right:15px}
 .brand{font-size:10px}.subtitle{font-size:8px}.sector{font-size:9px}
 .instructions{top:85px;left:15px;right:15px;transform:none;white-space:normal;font-size:9px;line-height:1.5}
 .planet-a{left:3%;top:16%}.planet-b{right:4%;top:11%}

 .portal-one{--x:18%!important;--y:35%!important}
 .portal-two{--x:82%!important;--y:65%!important}
 .milestone{bottom:87px;left:15px;max-width:86%;font-size:10px;gap:8px}
 .endcard{bottom:80px;padding:12px;width:calc(100% - 25px)}
 .endcard p{font-size:12px;line-height:1.45}
 .endcard .signoff{font-size:9px;margin-top:6px}
 .controls{bottom:14px;left:15px;right:15px}
 .controls-bottom span{max-width:65%;font-size:8px;line-height:1.45}
 .replay{font-size:9px;padding:8px 10px}
}
@media(prefers-reduced-motion:reduce){
 .portal::before,.portal-rings,.space-nebula,.universe.warping .rings{animation:none!important}
}
</style></head>

function setSector(n){
 sector=n%sectorNames.length;root.dataset.sector=String(sector);
 sectorLabel.textContent="SECTOR "+String(sector+1).padStart(2,"0")+" / "+sectorNames[sector];
 stars=stars.map(()=>newStar());
}
function placeShip(x,y,rotation=0,scale=1,opacity=1){
 const dx=x-W/2,dy=y-H/2;
 ship.style.transform=`translate(-50%,-40%) translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px) rotate(${rotation.toFixed(1)}deg) scale(${scale.toFixed(3)})`;
 ship.style.opacity=String(opacity);
 const wobble=warp?0:Math.sin(performance.now()/420)*5;
 shipGroup.setAttribute("transform","translate(0 "+wobble.toFixed(1)+")");
}
function showMilestone(i){
 if(i===currentSymbol)return;
 currentSymbol=i;
 if(i<0||i>=MILESTONES.length){iconRoot.innerHTML="";return;}
 const [name,sym]=MILESTONES[i];
 iconRoot.innerHTML=ICONS[sym];
 milestoneTitle.textContent=name;milestoneNumber.textContent=String(i+1).padStart(2,"0")+" / 07";
}
function updateStory(){
 progress.style.width=(storyMs/LENGTH*100).toFixed(2)+"%";
 if(storyMs>=OUTRO){
  iconRoot.innerHTML="";
  milestoneUI.style.opacity="0";
  endcard.classList.add("visible");
  const count=clamp(Math.floor((storyMs-OUTRO)/6900*STATEMENT.length),0,STATEMENT.length);
  endtext.textContent=STATEMENT.slice(0,count);
  return;
 }
 endcard.classList.remove("visible");milestoneUI.style.opacity="1";
 const i=Math.floor((storyMs-INTRO)/STEP);
 if(i<0||i>=MILESTONES.length){iconRoot.innerHTML="";return;}
 showMilestone(i);
 const t=clamp((storyMs-(INTRO+i*STEP))/SUCK,0,1);
 const e=ease(t),scale=1-.48*e;
 // Translate the symbol along the fixed beam centre; scale only the symbol, not its translated parent.
 floatGroup.setAttribute("transform","translate("+456+" "+(521-255*e).toFixed(1)+")");
 const icon=iconRoot.querySelector(".career-symbol");
 if(icon){
  icon.setAttribute("transform","scale("+scale.toFixed(3)+")");
  icon.style.opacity=String(t<.13?t/.13:t>.86?(1-t)/.14:1);
 }
}
function centreOf(portal){
 const b=portal.getBoundingClientRect(),s=root.getBoundingClientRect();
 return{x:b.left-s.left+b.width/2,y:b.top-s.top+b.height/2,r:b.width*.39+18};
}
function startWarp(portal,now){
 if(warp||now<cooldown)return;
 const c=centreOf(portal),next=(sector+Number(portal.dataset.jump||1))%sectorNames.length;
 warp={start:now,c,from:{...shipPos},next,changed:false,dest:{x:W*(next%2?.36:.65),y:H*(next%2?.46:.38)}};
 root.style.setProperty("--warp-x",c.x+"px");root.style.setProperty("--warp-y",c.y+"px");
 root.classList.remove("warping");void root.offsetWidth;root.classList.add("warping");
 caption.textContent="SPIRALING THROUGH A WORMHOLE";
}
function updateWarp(now){
 const t=clamp((now-warp.start)/2000,0,1);
 if(t<.5){
  const u=ease(t*2),a=u*Math.PI*4,rad=(1-u)*47;
  const x=warp.from.x+(warp.c.x-warp.from.x)*u+Math.cos(a)*rad-rad;
  const y=warp.from.y+(warp.c.y-warp.from.y)*u+Math.sin(a)*rad;
  placeShip(x,y,reduced?0:u*720,reduced?1:1-.94*u,1-.73*u);
 }else{
  if(!warp.changed){warp.changed=true;setSector(warp.next);caption.textContent="ARRIVING / "+sectorNames[sector];}
  const u=ease((t-.5)*2);
  placeShip(warp.dest.x,warp.dest.y,reduced?0:(u-1)*720,reduced?1:.06+.94*u,.27+.73*u);
 }
 if(t>=1){
  shipPos={...warp.dest};target={...warp.dest};warp=null;cooldown=now+1700;
  root.classList.remove("warping");ship.style.opacity="1";
 }
}
function checkPortals(now){
 if(now<cooldown)return;
 for(const p of portals){const c=centreOf(p);if(Math.hypot(c.x-shipPos.x,c.y-shipPos.y)<c.r){startWarp(p,now);break;}}
}
function frame(now){
 if(!last)last=now;const dt=Math.min(60,Math.max(1,now-last));last=now;
 drawField(dt);
 if(warp){updateWarp(now);}else{
  shipPos.x+=(target.x-shipPos.x)*.17;
  shipPos.y+=(target.y-shipPos.y)*.17;
  placeShip(shipPos.x,shipPos.y,clamp((target.x-shipPos.x)*.045,-8,8));
  checkPortals(now);
  storyMs=Math.min(LENGTH,storyMs+dt);
 }
 updateStory();
 raf=requestAnimationFrame(frame);
}
function reset(){
 cancelAnimationFrame(raf);sector=0;root.dataset.sector="0";setSector(0);
 warp=null;cooldown=0;storyMs=0;last=0;currentSymbol=-1;shipPos={x:W*.5,y:H*.48};target={...shipPos};
 milestoneTitle.textContent="A CURIOUS TRAJECTORY";milestoneNumber.textContent="00 / 07";
 milestoneUI.style.opacity="1";endcard.classList.remove("visible");endtext.textContent="";iconRoot.innerHTML="";
 placeShip(shipPos.x,shipPos.y);raf=requestAnimationFrame(frame);
}
function pointTo(e){
 const b=root.getBoundingClientRect();
 target={x:clamp(e.clientX-b.left,W*.05,W*.95),y:clamp(e.clientY-b.top,H*.12,H*.87)};
}
root.addEventListener("pointermove",e=>{if(!warp)pointTo(e);});
root.addEventListener("pointerdown",e=>{if(e.target.closest(".replay"))return;if(!warp)pointTo(e);});
root.addEventListener("pointerleave",()=>{});
window.addEventListener("keydown",e=>{
 const shifts={ArrowLeft:[-110,0],ArrowRight:[110,0],ArrowUp:[0,-95],ArrowDown:[0,95]};
 if(shifts[e.key]){e.preventDefault();const d=shifts[e.key];target.x=clamp(target.x+d[0],W*.05,W*.95);target.y=clamp(target.y+d[1],H*.12,H*.87);}
});
portals.forEach(p=>p.addEventListener("click",e=>{e.stopPropagation();startWarp(p,performance.now());}));
replay.addEventListener("click",e=>{e.stopPropagation();reset();});
window.addEventListener("resize",()=>{resize();shipPos.x=clamp(shipPos.x,W*.05,W*.95);shipPos.y=clamp(shipPos.y,H*.12,H*.87);target={...shipPos};});
resize();reset();
</script></body></html>
